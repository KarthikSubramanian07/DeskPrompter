[package]
name = "relay"
version = "0.1.0"
edition = "2021"
description = "DeskPrompter signaling relay: a Cloudflare Worker + Durable Object that pairs a prompter with its phone remote."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.8.7"
console_error_panic_hook = "0.1"
