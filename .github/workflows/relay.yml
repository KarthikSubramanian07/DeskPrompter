name: relay

on:
  push:
    branches: [main]
    paths:
      - 'crates/relay/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/relay.yml'
  pull_request:
    paths:
      - 'crates/relay/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/relay.yml'
  workflow_dispatch:

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RELAY_URL: https://deskprompter-relay.karthik-e5e.workers.dev

jobs:
  test:
    name: Test relay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt -p relay --check
      - name: Unit tests (host target)
        run: cargo test -p relay
      - name: Clippy (worker target)
        run: cargo clippy -p relay --target wasm32-unknown-unknown -- -D warnings

  deploy:
    name: Deploy relay
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip without credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the relay deploy."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: dtolnay/rust-toolchain@stable
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: oven-sh/setup-bun@v2
        if: env.CLOUDFLARE_API_TOKEN != ''
      - name: Deploy with wrangler
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: crates/relay
        run: npx --yes wrangler@4 deploy
      - name: Smoke test production
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: bun crates/relay/e2e.ts "$RELAY_URL"
