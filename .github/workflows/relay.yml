name: relay

on:
  push:
    branches: [main]
    paths:
      - 'crates/relay/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/relay.yml'
  pull_request:
    paths:
      - 'crates/relay/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/relay.yml'
  workflow_dispatch:

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RELAY_URL: https://deskprompter-relay.karthik-e5e.workers.dev

permissions:
  contents: read

jobs:
  test:
    name: Test relay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format
        run: cargo fmt -p relay --check
      - name: Unit tests (host target)
        run: cargo test -p relay
      - name: Clippy (worker target)
        run: cargo clippy -p relay --target wasm32-unknown-unknown -- -D warnings

  deploy:
    name: Deploy relay
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip without credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the relay deploy."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: env.CLOUDFLARE_API_TOKEN != ''
      - name: Deploy with wrangler
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: crates/relay
        run: npx --yes wrangler@4 deploy
      - name: Smoke test production
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: bun crates/relay/e2e.ts "$RELAY_URL"
